<section>
  <h2 class="example-title">Ejemplo 1 - Context Menu Básico</h2>
  <div class="coordinates-input">
    <label>X: <input type="number" [(ngModel)]="coordX1" min="0" /></label>
    <label>Y: <input type="number" [(ngModel)]="coordY1" min="0" /></label>
  </div>
  <div #area1 class="context-area" (contextmenu)="openContextMenu($event, 1, area1)">
    <p>Haz clic derecho aquí para abrir el menú contextual</p>
  </div>

  <dcx-ng-context-menu
    #contextMenu1
    [items]="menuItems"
    [position]="menuPosition1"
    (itemSelected)="onItemSelected($event)"
  >
  </dcx-ng-context-menu>
</section>

<hr />

<section>
  <h2 class="example-title">Ejemplo 2 - Context Menu con Botón</h2>
  <div #buttonTrigger>
    <dcx-ng-button
      label="Abrir menú contextual"
      variant="primary"
      (buttonClick)="openContextMenuFromButton(buttonTrigger)"
    >
    </dcx-ng-button>
  </div>

  <dcx-ng-context-menu
    #contextMenu2
    [items]="advancedMenuItems"
    [position]="menuPosition2"
    (itemSelected)="onItemSelected($event)"
  >
  </dcx-ng-context-menu>
</section>

<hr />

<section>
  <h2 class="example-title">Ejemplo 3 - Context Menu con Sublistas</h2>
  <div class="coordinates-input">

  <dcx-ng-context-menu
    #contextMenu3

  </dcx-ng-context-menu>
</section>
