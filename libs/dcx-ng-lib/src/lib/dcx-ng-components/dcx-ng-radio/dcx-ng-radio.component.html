<fieldset
  class="dcx-ng-radio-group"
  [attr.aria-label]="!label() ? ariaLabel() || null : null"
  [attr.aria-describedby]="describedBy()"
>
  @if (label()) {
    <legend class="dcx-ng-radio-group__legend">{{ label() }}</legend>
  }

  <div class="dcx-ng-radio-group__options">
    @for (option of options(); track option.value) {
      <label [class]="radioClasses(option)">
        <input
          class="dcx-ng-radio__native"
          type="radio"
          [name]="name()"
          [value]="option.value"
          [checked]="isChecked(option.value)"
          [disabled]="isOptionDisabled(option)"
          [attr.aria-invalid]="error() ? 'true' : null"
          (change)="onOptionChange(option)"
          (blur)="onBlur()"
        />

        <span class="dcx-ng-radio__control" aria-hidden="true"></span>

        <span class="dcx-ng-radio__label">{{ option.label }}</span>
      </label>
    }
  </div>

  @if (showError()) {
    <div class="dcx-ng-radio-group__error" role="alert" [id]="errorId">
      {{ errorMessage() }}
    </div>
  }

  @if (showHint()) {
    <div class="dcx-ng-radio-group__hint" [id]="hintId">{{ hint() }}</div>
  }
</fieldset>
