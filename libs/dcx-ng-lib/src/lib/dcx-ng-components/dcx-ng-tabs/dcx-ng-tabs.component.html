<div class="dcx-tabs">
  @if (hasControls()) {
    <div class="dcx-tabs__controls">
      @for (tab of tabs(); track tab.id; let i = $index) {
        <dcx-ng-button
          label="{{(i+1).toString()}}"
          (buttonClick)="selectTab(tab.id)"
          [pressed]="isButtonPressed(tab.id)"
        >
        </dcx-ng-button>
      }
    </div>
  }
  <div class="dcx-tabs__header-container">
    @if (hasOverflow() && canScrollLeft()) {
      <dcx-ng-button
        class="dcx-tabs__scroll-button dcx-tabs__scroll-button--left"
        variant="icon-only"
        size="m"
        icon
        [iconName]="'chevron-left'"
        [iconSize]="'l'"
        (buttonClick)="scrollLeft()"
        [attr.aria-label]="'Desplazar a la izquierda'"
      ></dcx-ng-button>
    }
    <!-- El tablist en sí no es focuseable: usa tabindex roving en los <button role="tab">
         hijos (patrón APG Tabs) y captura keydown por delegación desde el hijo con foco. -->
    <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
    <div
      [class]="tabHeaderClasses()"
      role="tablist"
      [attr.aria-label]="ariaLabel()"
      #tabsHeader
      (scroll)="updateScrollButtons()"
      (keydown)="onKeydown($event)"
    >
      @for (tab of tabs(); track tab.id) {
        <button
          type="button"
          [class]="tabButtonClasses(tab.id)"
          [id]="tab.id"
          role="tab"
          [attr.aria-selected]="isActive(tab.id)"
          [attr.aria-controls]="'panel-' + tab.id"
          [attr.data-tab]="tab.id"
          [attr.aria-disabled]="!!tab.disabled"
          [disabled]="!!tab.disabled"
          [tabIndex]="isActive(tab.id) && !tab.disabled ? 0 : -1"
          (click)="selectTab(tab.id)"
        >
          @if (tab.icon) {
            <dcx-ng-icon [name]="tab.icon" [size]="'l'" aria-hidden="true" />
          }
          {{ tab.label }}
          @if (tab.badge !== undefined && tab.badge !== null) {
            <span class="dcx-tab__badge" [class.active]="isActive(tab.id)">{{ tab.badge }}</span>
          }
        </button>
      }
    </div>
    @if (hasOverflow() && canScrollRight()) {
      <dcx-ng-button
        class="dcx-tabs__scroll-button dcx-tabs__scroll-button--right"
        variant="icon-only"
        size="m"
        icon
        [iconName]="'chevron-right'"
        [iconSize]="'l'"
        (buttonClick)="scrollRight()"
        [attr.aria-label]="'Desplazar a la derecha'"
      ></dcx-ng-button>
    }
  </div>

  @if (activeTab(); as tab) {
    <div class="dcx-tabs__content">
      <div
        class="dcx-tab__panel"
        role="tabpanel"
        [id]="'panel-' + tab.id"
        [attr.aria-labelledby]="tab.id"
      >
        <ng-content></ng-content>
      </div>
    </div>
  }
</div>
