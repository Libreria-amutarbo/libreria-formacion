<div
  [class]="toastClasses()"
  [attr.role]="role()"
  [attr.aria-live]="ariaLive()"
>
  <dcx-ng-message
    class="dcx-toast__message-content"
    [body]="message()"
    [type]="resolvedMessageType()"
    [icon]="true"
    [iconName]="resolvedIconName()"
    [announce]="false"
  ></dcx-ng-message>

  @if (hasAction()) {
    <dcx-ng-button
      class="dcx-toast__action"
      [label]="actionLabel()"
      [icon]="!!actionIconName().trim()"
      [iconName]="actionIconName()"
      [ariaLabel]="resolvedActionAriaLabel()"
      variant="text"
      size="m"
      (buttonClick)="onAction()"
    ></dcx-ng-button>
  }
</div>
