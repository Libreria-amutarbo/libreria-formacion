<div [class]="carouselClass()" role="region" aria-roledescription="carousel">
  <div class="dcx-carousel-content">
    @if (showNavigatorButtons()) {
      <dcx-ng-button
        variant="secondary"
        size="s"
        class="dcx-carousel-prev"
        (click)="prev()"
        aria-label="Previous slide"
      >
        <dcx-ng-icon [name]="currentIcon()"></dcx-ng-icon>
      </dcx-ng-button>
    }

    <div class="dcx-carousel-container">
      <div
        class="dcx-carousel-items-wrapper"
        [style.transform]="wrapperTransform()"
        [style.flex-direction]="slideDirection()"
      >
        @for (item of value(); track $index) {
          <div class="dcx-carousel-item">
            <ng-container
              *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"
            ></ng-container>
          </div>
        }
      </div>
    </div>

    @if (showNavigatorButtons()) {
      <dcx-ng-button
        variant="secondary"
        size="s"
        class="dcx-carousel-next"
        (click)="next()"
        aria-label="Next slide"
      >
        <dcx-ng-icon [name]="nextIcon()"></dcx-ng-icon>
      </dcx-ng-button>
    }
  </div>

  @if (showIndicatorDots()) {
    <div class="dcx-carousel-indicators">
      @for (item of value(); track $index) {
        <dcx-ng-button
          type="button"
          variant="terciary"
          size="s"
          [class]="indicatorClass($index)"
          [ariaLabel]="'Go to slide ' + ($index + 1)"
          (buttonClick)="setPage($index)"
        ></dcx-ng-button>
      }
    </div>
  }
</div>
