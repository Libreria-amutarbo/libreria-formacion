<div
  [class]="carouselClass()"
  role="region"
  aria-roledescription="carousel"
  [attr.aria-label]="ariaLabel()"
  (keydown)="onKeydown($event)"
  (mouseenter)="pauseAutoplay()"
  (mouseleave)="resumeAutoplay()"
  (focusin)="pauseAutoplay()"
  (focusout)="resumeAutoplay()"
>
  <!-- Región aria-live para anunciar cambios de slide a lectores de pantalla -->
  <div class="dcx-carousel-sr-only" aria-live="polite" aria-atomic="true">
    {{ liveAnnouncement() }}
  </div>

  <div class="dcx-carousel-content">
    @if (showNavigatorButtons() && !isPrevDisabled()) {
      <dcx-ng-button
        variant="secondary"
        size="s"
        class="dcx-carousel-prev"
        (click)="prev()"
        ariaLabel="Diapositiva anterior"
      >
        <dcx-ng-icon [name]="currentIcon()"></dcx-ng-icon>
      </dcx-ng-button>
    }

    <div class="dcx-carousel-container">
      <div
        class="dcx-carousel-items-wrapper"
        [style.transform]="wrapperTransform()"
        [style.flex-direction]="slideDirection()"
      >
        @for (item of value(); track $index) {
          <div
            class="dcx-carousel-item"
            [attr.aria-hidden]="$index !== currentPage() || null"
            [attr.aria-label]="'Diapositiva ' + ($index + 1) + ' de ' + totalItems()"
          >
            <ng-container
              *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"
            ></ng-container>
          </div>
        }
      </div>
    </div>

    @if (showNavigatorButtons() && !isNextDisabled()) {
      <dcx-ng-button
        variant="secondary"
        size="s"
        class="dcx-carousel-next"
        (click)="next()"
        ariaLabel="Diapositiva siguiente"
      >
        <dcx-ng-icon [name]="nextIcon()"></dcx-ng-icon>
      </dcx-ng-button>
    }
  </div>

  @if (showIndicatorDots()) {
    <div class="dcx-carousel-indicators" role="group" aria-label="Indicadores de diapositiva">
      @for (item of value(); track $index) {
        <dcx-ng-button
          type="button"
          variant="terciary"
          size="s"
          [class]="indicatorClass($index)"
          [ariaLabel]="'Ir a la diapositiva ' + ($index + 1)"
          [attr.aria-pressed]="$index === currentPage()"
          (buttonClick)="setPage($index)"
        ></dcx-ng-button>
      }
    </div>
  }
</div>
