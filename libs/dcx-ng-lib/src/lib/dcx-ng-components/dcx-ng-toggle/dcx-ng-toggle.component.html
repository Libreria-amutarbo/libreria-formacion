<button
  type="button"
  [class]="sizeClasses()"
  [class.disabled]="disabled()"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="effectiveAriaLabel()"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <span class="dcx-ng-toggle__track">
    <span class="dcx-ng-toggle__thumb" [class.checked]="checked()"></span>
  </span>

  @if (label()) {
    <span class="dcx-ng-toggle__label">{{ label() }}</span>
  }
</button>
