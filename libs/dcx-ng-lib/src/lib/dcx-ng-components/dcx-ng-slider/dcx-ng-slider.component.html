@if (showLabel()) {
  <div class="dcx-slider-value-label" [class.is-disabled]="disabled()">
    <span class="dcx-slider-label">{{ textLabel() }}</span>
    <span class="dcx-slider-value">{{ displayValue() }}</span>
  </div>
}

<dcx-ng-input
  class="dcx-slider-input"
  [type]="inputType.RANGE"
  [value]="valueInput()"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [disabled]="disabled()"
  [ariaLabel]="effectiveAriaLabel()"
  [ariaValueText]="effectiveAriaValueText()"
  [style.width]="vertical() ? '100px' : '100%'"
  [orientation]="vertical() ? 'vertical' : 'horizontal'"
  (valueChange)="onInput($event)"
/>
