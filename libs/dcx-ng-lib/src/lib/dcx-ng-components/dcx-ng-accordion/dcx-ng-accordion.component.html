<div class="accordion" [class]="accordionClasses()" [attr.aria-label]="ariaLabel()">
  @for (item of items(); track item.id) {
    <div
      class="accordion-item"
      [class.disabled]="item.disabled"
      [class.expanded]="isExpanded(item.id)"
    >
      <h3 class="accordion-heading">
        <button
          class="accordion-header"
          [id]="'accordion-header-' + item.id"
          [attr.aria-expanded]="isExpanded(item.id)"
          [attr.aria-controls]="'accordion-content-' + item.id"
          [disabled]="item.disabled || null"
          (click)="toggleItem(item)"
          (keydown)="onHeaderKeydown($event)"
        >
          @if (item.icon) {
            <dcx-ng-icon
              class="accordion-icon"
              [name]="item.icon"
              [size]="'m'"
              aria-hidden="true"
            />
          }
          <span class="accordion-title-group">
            <span class="accordion-title">{{ item.title }}</span>
            @if (item.description) {
              <span class="accordion-description">{{ item.description }}</span>
            }
          </span>
          <dcx-ng-icon
            class="accordion-chevron"
            [name]="getIconItemExpanded()"
            [size]="'m'"
            aria-hidden="true"
          />
        </button>
      </h3>

      <div
        class="accordion-content-wrapper"
        [class.expanded]="isExpanded(item.id)"
        [class.disabled-content]="item.disabledContent"
        [attr.id]="'accordion-content-' + item.id"
        [attr.aria-labelledby]="'accordion-header-' + item.id"
        [attr.aria-hidden]="!isExpanded(item.id)"
        role="region"
      >
        <div
          class="accordion-content"
          [class.scrollable]="!!item.maxContentHeight"
          [style.max-height]="item.maxContentHeight || null"
        >
          @if (item.contentTemplate) {
            <ng-container *ngTemplateOutlet="item.contentTemplate" />
          } @else {
            <div [innerHTML]="item.content"></div>
          }
        </div>
      </div>
    </div>
  }
</div>
