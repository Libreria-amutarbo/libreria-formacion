<div
  class="dcx-ng-scroll-top-down__group"
  role="group"
  [attr.aria-label]="groupLabel()"
>
  @if (isTopVisible()) {
    <button
      [class]="buttonClasses('top')"
      type="button"
      [attr.aria-label]="topLabel()"
      (click)="scrollToTop()"
    >
      <dcx-ng-icon [name]="topIcon()" [size]="iconSize()" aria-hidden="true" />
    </button>
  }

  @if (isBottomVisible()) {
    <button
      [class]="buttonClasses('bottom')"
      type="button"
      [attr.aria-label]="bottomLabel()"
      (click)="scrollToBottom()"
    >
      <dcx-ng-icon [name]="bottomIcon()" [size]="iconSize()" aria-hidden="true" />
    </button>
  }
</div>
