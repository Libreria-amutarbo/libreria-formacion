@if (isOpen()) {
  <div
    #container
    class="dcx-context-menu"
    [class.dcx-context-menu--absolute]="positionMode() === 'absolute'"
    [style.top]="top()"
    [style.left]="left()"
    [style.opacity]="isPositioned() ? '1' : '0'"
    (click)="$event.stopPropagation()"
    tabindex="-1"
    role="menu"
    aria-label="Menú contextual"
  >
    <dcx-ng-list
      class="dcx-context-menu-list"
      [items]="items()"
      [selectable]="true"
      [renderChildren]="true"
      [showChildrenIndicator]="true"
      listRole="presentation"
      itemRole="menuitem"
      (itemSelected)="onListItemSelected($event)"
    >
    </dcx-ng-list>
  </div>
}
