<div class="tooltip-container">
  <ng-content></ng-content>
</div>

<ng-template #tooltipTemplate>
  <div
    [id]="tooltipId"
    role="tooltip"
    [class]="tooltipClasses()"
  >
    @if (contentHtml()) {
      <div [innerHTML]="sanitizedHtml()"></div>
    } @else {
      {{ content() }}
    }
    <div class="tooltip-arrow"></div>
  </div>
</ng-template>
