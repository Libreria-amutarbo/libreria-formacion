<div class="dcx-checkbox-group">
  <div class="dcx-checkbox-group__options">
    @for (option of _options(); track option.id) {
      <label
        class="dcx-checkbox-label"
        [class.disabled]="option.disabled"
        [class.label-left]="option.labelPosition === 'left'"
      >
        @if (
          option.labelPosition === 'left' || option.labelPosition === undefined
        ) {
          <ng-container
            *ngTemplateOutlet="textLabel; context: {option: option}"
          ></ng-container>
        }
        <dcx-ng-button
          [variant]="getButtonVariant(option)"
          icon
          isCheckbox
          [disabled]="option.disabled ?? false"
          [checkboxError]="getCheckboxError(option)"
          [iconName]="getIconName(option)"
          [iconSize]="'l'"
          [ariaLabel]="option.label ?? 'Checkbox'"
          [ariaChecked]="getAriaChecked(option)"
          [attr.aria-disabled]="option.disabled || null"
          [attr.aria-describedby]="option.error && option.errorMessage ? 'checkbox-error-' + option.id : null"
          (buttonClick)="changeValue(option.id)"
        >
        </dcx-ng-button>

        @if (option.labelPosition === 'right') {
          <ng-container
            *ngTemplateOutlet="textLabel; context: {option: option}"
          ></ng-container>
        }
      </label>
      @if (option.error && option.errorMessage !== '') {
        <div
          class="dcx-ng-checkbox__error"
          [id]="'checkbox-error-' + option.id"
          role="alert"
        >
          <dcx-ng-icon [name]="errorIcon()" aria-hidden="true"></dcx-ng-icon>
          <span>{{ option.errorMessage }}</span>
        </div>
      }
    }
  </div>
</div>

<ng-template #textLabel let-option="option">
  <span
    class="dcx-checkbox-text"
    [class.error]="option.error"
    >{{ option.label }}</span
  >
  @if (option.required) {
    <span class="dcx-ng-checkbox__required" aria-hidden="true">*</span>
  }
</ng-template>
